[project]
name = "hashiru-lite"
version = "0.1.0"
description = "Minimal HASHIRU-style multi-agent orchestrator on MCP and A2A (CS239 project)"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.2.0",
    "a2a-sdk[http-server]==1.2.2",
    "litellm==1.103.4",
    "httpx",
    "psutil",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
